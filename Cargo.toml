[package]
name = "meerkat_distributed"
version = "0.3.0"
edition = "2021"

[build-dependencies]
lalrpop = "0.20.2"

[dependencies]
lalrpop-util = { version = "0.20.2", features = ["lexer", "unicode"] }
# pretty = "0.12.3"
inline_colorization = "0.1.5"
# petgraph = "0.6.5"
tokio = { version = "1", features = ["full"] }
json = "0.12.4"
# tokio-util = "0.7.11"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
tokio-tungstenite = "0.20"
futures-util = "0.3"
dashmap = "6.1.0"
regex = "1.11.1"
